[package]
name = "scoop-uv"
version = "0.20.1"
edition = "2024"
rust-version = "1.89"
authors = ["Hanyul <pignuante@gmail.com>"]
description = "Scoop up your Python envs with uv — the command is scuv"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai-screams/scoop-uv"
homepage = "https://ai-scream.ai/scoop-uv/"
documentation = "https://docs.rs/scoop-uv"
readme = "README.md"
keywords = ["python", "virtualenv", "uv", "pyenv", "environment"]
categories = ["command-line-utilities", "development-tools"]
# 화이트리스트: crates.io 배포에 필요한 파일만 포함
include = [
    "src/**/*.rs",
    # Shell script pieces pulled in by include_str! (src/shell/*.rs).
    "src/shell/scripts/*",
    "build.rs",
    "Cargo.toml",
    "/LICENSE-*",
    "/README.md",
    "/rust-toolchain.toml",
    "locales/**/*.yml",
]

[[bin]]
name = "scuv"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal UI
owo-colors = "4.0"
indicatif = "0.18"
dialoguer = "0.12"

# Utilities
dirs = "7.0"
which = "8.0.3"
regex = "1.11"
once_cell = "1.21"
chrono = { version = "0.4", features = ["serde", "std", "clock"], default-features = false }
walkdir = "2.5"
# Atomic file writes (tempfile + rename) for metadata touch updates so a
# crash mid-write can't truncate `.scoop-metadata.json` to garbage.
tempfile = "3.27"

# i18n
rust-i18n = "4"
sys-locale = "0.3"
toml = { version = "1.1.2", features = ["parse"] }
rayon = "1.12.0"

# Man pages — generated at runtime by `scoop man [DIR]`. clap_mangen consumes
# the same `clap::Command` tree used by the CLI, so the man pages stay in sync
# with `--help` automatically.
clap_mangen = "0.3"

# Unix only: restores the default SIGPIPE action at startup so `scuv ... | head`
# ends quietly instead of panicking on a closed stdout. Already in the lock
# file through several dependencies.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
serial_test = "3.2"
proptest = "1.11"
rstest = "0.28"
# YAML for the locale-parity test. serde-saphyr is already in the lock file --
# rust-i18n parses this same app.yml with it at build time -- so this adds no
# new package. `deserialize` only: the test reads, never writes.
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
# Benchmark runner. html_reports gives a `target/criterion/report/index.html`
# overview that's useful when comparing baselines locally.
criterion = { version = "0.8", features = ["html_reports"] }
# Parse src/ for the module-boundary test (tests/module_boundaries.rs).
# Both are already in the lock file with these features (proc-macro
# dependencies pull them in), so this adds no new package.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

# Benchmarks live in benches/. Each [[bench]] entry compiles to its own
# binary, so a broken bench only fails one target — useful during regressions.
[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "path_lookup"
harness = false

[lints.clippy]
# The MSRV clippy promotes `uninlined_format_args` to a default warning.
# The codebase uses the explicit `format!("{}", x)` style in ~270 places; that
# is a cosmetic preference, not a defect, so allow it rather than churn every
# call site inside an infrastructure bump. Revisit as a standalone cleanup.
uninlined_format_args = "allow"

# Selected only by cargo-mutants (`profile` in .cargo/mutants.toml). It
# disables debug info to cut each mutant's rebuild; debug assertions and
# overflow checks stay as in `test`.
[profile.mutants]
inherits = "test"
debug = "none"

[profile.release]
lto = true
strip = true
codegen-units = 1
