# Documentation checks (PR only)
#
# docs.yml deploys, and deploys only on `v*` tags and manual dispatch. Its
# guards therefore never saw a pull request, so a PR that edited `docs/src/**`
# without regenerating `ko.po` merged green and broke the next release
# instead. That is not hypothetical: #175 went green and the `v0.15.4` tag
# then failed at the `ko.po` round-trip. The crate published and the tag was
# fine — only the Pages deploy stopped, which is the quiet half of the
# failure and the reason nobody noticed until the site was opened.
#
# This workflow runs the same build and the same stale-PO guard on PRs, and
# nothing else. Split from docs.yml rather than bolted onto it so that a PR
# run needs neither `pages: write` nor `id-token: write`, and never enters the
# `pages` concurrency group where it would queue behind — or ahead of — a real
# release deployment.

name: Documentation checks

on:
  pull_request:
    branches: [main]
    # Only what the mdBook build and the PO round-trip actually read. Note
    # `locales/app.yml` is deliberately absent: that is the application's
    # translation catalogue, checked by tests/i18n_completeness.rs, and it is
    # not an input to the docs gettext cycle.
    paths:
      - 'docs/src/**'
      - 'docs/po/**'
      - 'docs/book.toml'
      - 'docs/theme/**'
      - '.github/workflows/docs-check.yml'

# No `pages: write`, no `id-token: write` — this workflow never deploys.
permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.3"
  MDBOOK_I18N_HELPERS_VERSION: "0.4.0"

jobs:
  check:
    name: Build and verify translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install gettext
        run: sudo apt-get install -y gettext

      # mdbook-i18n-helpers 0.4.0 (depends on mdbook-core 0.5) needs
      # rustc 1.88+ to build. The project's rust-toolchain.toml pins
      # 1.89 (MSRV); we install stable explicitly here and run the
      # `cargo install` from a directory outside the repo so the
      # project's toolchain pin doesn't override it.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Measured at 39s of the job's ~57s, so it is the whole cost of running
      # this on PRs. Cached the way msrv-check.yml caches cargo-msrv; the key
      # carries the pinned version, so bumping MDBOOK_I18N_HELPERS_VERSION
      # misses the cache and reinstalls.
      - name: Cache mdbook-i18n-helpers binaries
        id: cache-i18n-helpers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/mdbook-xgettext
            ~/.cargo/bin/mdbook-gettext
          key: ${{ runner.os }}-mdbook-i18n-helpers-${{ env.MDBOOK_I18N_HELPERS_VERSION }}

      - name: Install mdbook-i18n-helpers
        if: steps.cache-i18n-helpers.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install mdbook-i18n-helpers --version "$MDBOOK_I18N_HELPERS_VERSION" --locked

      - name: Install mdBook
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz --directory=bin
          echo "$PWD/bin" >> $GITHUB_PATH

      # Stale-PO guard: regenerate the pot template from current
      # English source and msgmerge it into ko.po. If the resulting
      # ko.po differs from what's committed, source-level edits
      # without translation updates have crept in — fail the build.
      #
      # msgmerge rewrites two header lines (POT-Creation-Date and
      # PO-Revision-Date) to "now" on every run, which would trip
      # `git diff --exit-code` even when translations are in sync.
      # Restore the original values after the merge so the diff only
      # surfaces real semantic changes.
      - name: Verify ko translations are in sync
        working-directory: docs
        run: |
          MDBOOK_OUTPUT='{"xgettext": {}}' mdbook build -d po
          cp po/ko.po /tmp/orig-ko.po
          msgmerge --update --backup=none po/ko.po po/messages.pot
          # Restore the two timestamp headers so `git diff --exit-code`
          # below only catches semantic changes. msgmerge rewrites both
          # to "now" every run, which would otherwise turn this guard
          # into a permanent CI failure (volatile timestamps != stale
          # translations).
          python3 - <<'PYEOF'
          import re
          ORIG = '/tmp/orig-ko.po'
          NEW = 'po/ko.po'
          orig = open(ORIG, encoding='utf-8').read()
          new = open(NEW, encoding='utf-8').read()
          for key in ('POT-Creation-Date', 'PO-Revision-Date'):
              pattern = r'^"' + key + r':.*$'
              m = re.search(pattern, orig, flags=re.M)
              if m:
                  new = re.sub(pattern, lambda _: m.group(0), new, count=1, flags=re.M)
          open(NEW, 'w', encoding='utf-8').write(new)
          PYEOF
          if ! git diff --exit-code po/ko.po; then
            echo '::error::docs/po/ko.po is out of date. Re-run `cd docs && MDBOOK_OUTPUT='\''{"xgettext": {}}'\'' mdbook build -d po && msgmerge --update --backup=none po/ko.po po/messages.pot` and commit the result.'
            exit 1
          fi

      - name: Build English (root)
        working-directory: docs
        run: mdbook build -d book

      - name: Build Korean (book/ko)
        working-directory: docs
        env:
          MDBOOK_BOOK__LANGUAGE: ko
        run: mdbook build -d book/ko
