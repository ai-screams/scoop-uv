# Docker-based Integration Tests — multi-source matrix
#
# Builds each per-source Docker fixture stage (pyenv-fixture /
# conda-fixture / venvwrapper-fixture) in parallel via a GH Actions matrix, with per-source
# BuildKit cache scoping so the variants don't fight over the same cache.
# Replaces the previous pyenv-only setup; the matrix subsumes that case.
# On a PR that changes no file the build or the tests read, every job
# still runs and posts its check, but skips its steps (the scope step).

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel stale PR runs when new commits are pushed; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docker-integration:
    name: Docker Integration (${{ matrix.source-env }})
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Docker build + integration tests
    # Don't fail-fast: a flaky pyenv shouldn't mask a real conda regression.
    strategy:
      fail-fast: false
      matrix:
        source-env: [pyenv, conda, venvwrapper]
        # The env each image's fixture stage creates, the source_type
        # `scuv migrate list --json` reports for it, and its Python.
        include:
          - source-env: pyenv
            fixture: test-pyenv-312
            source-type: pyenv
            python: "3.12"
          - source-env: conda
            fixture: test-conda-312
            source-type: conda
            python: "3.12"
          - source-env: venvwrapper
            fixture: test-venvwrapper-312
            source-type: virtualenv_wrapper
            python: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history only where the step below needs a merge-base.
          # Keep '0' quoted: a bare 0 is falsy and the expression would
          # fall through to '1'.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # Skip the expensive steps on a PR that changes no file they read.
      # Gating steps, not the job, keeps every matrix check posted under
      # its real (required) name; a job-level `if` is evaluated before the
      # matrix expands and posts one check with the expression unexpanded,
      # and `on.paths` would leave the required checks Pending. Anything
      # short of a positive "no match" runs everything, and a skipped run
      # says so in the job summary. Classifier tests and the reasoning:
      # docs/src/development/ci-cd.md, "Skip what a PR cannot affect".
      - id: scope
        name: Decide whether this PR changes code
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CODE_PATHS: '^(src/|tests/|benches/|locales/|docker/|\.cargo/|\.config/|\.github/actions/|Cargo\.(toml|lock)$|build\.rs$|rust-toolchain\.toml$|\.dockerignore$|\.gitattributes$|\.github/workflows/integration-test\.yml$)'
        run: |
          # errexit stays on; each expected failure is handled where it
          # happens. -z keeps paths unquoted (a non-ASCII or newline name
          # would otherwise slip past the ^-anchored pattern), and
          # --no-renames lists both sides of a rename.
          code=true
          reason="not a pull request: running everything"
          if [ "$EVENT" = pull_request ]; then
            list="$RUNNER_TEMP/changed-files"
            if ! git diff --name-only --no-renames -z "$BASE...$HEAD" > "$list"; then
              reason="git diff failed: running everything"
            else
              rc=0
              grep -zqE "$CODE_PATHS" "$list" || rc=$?
              case $rc in
                0) reason="code paths changed" ;;
                1) code=false; reason="no code paths changed: tests skipped, not run" ;;
                *) reason="path match failed (grep $rc): running everything" ;;
              esac
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$reason (code=$code)"
          echo "$reason (code=$code)" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Set up Docker Buildx
        if: steps.scope.outputs.code != 'false'
        uses: docker/setup-buildx-action@v4

      # Build the matching fixture stage with GHA cache scoped per source-env
      # so the three matrix shards don't overwrite each other's cache.
      # mode=max exports every layer (not just the final image), so the
      # intermediate stages (Python builds, fixture installs) are reused too.
      # It holds no Cargo artifacts: the fixture stages compile nothing, and
      # the workspace is compiled by `docker run` below, outside BuildKit.
      #
      # Only pushes to main export: a PR run reads main's cache but writes
      # nothing, so closed PRs stop leaving ~2 GB of blobs behind. And the
      # export is ignore-error: with the repository at its 10 GB allowance,
      # LRU eviction ran during an export and failed a green build with
      # `error writing layer blob: not_found` (#198). A missed cache write
      # costs the next run a rebuild; it must not fail this one.
      # The *-fixture stages carry no scuv binary and do not depend on the
      # source tree (docker/Dockerfile header), so a change under src/
      # leaves every fixture layer cached; the workspace is compiled once,
      # inside the container, by the step below.
      - name: Build ${{ matrix.source-env }}-fixture image
        if: steps.scope.outputs.code != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.source-env }}-fixture
          load: true
          tags: scuv:${{ matrix.source-env }}-fixture
          cache-from: type=gha,scope=integration-${{ matrix.source-env }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=integration-{0},ignore-error=true', matrix.source-env) || '' }}

      - name: Run integration tests (${{ matrix.source-env }})
        if: steps.scope.outputs.code != 'false'
        # Use the image's normal entrypoint — it sets up pyenv / conda /
        # virtualenvwrapper init for us. The previous `--entrypoint=""`
        # bypass is no longer needed: entrypoint.sh now wraps each
        # third-party init block with `set +e`, so benign initialization
        # failures in fresh containers don't abort the entrypoint.
        # --run-ignored all: the image has uv and Python 3.12, so the tests
        # that need them (ignored on a bare runner) run here as well.
        # nextest runs each test in its own process (.config/nextest.toml)
        # and builds the scuv binary along with the tests, so this is the
        # only compile: SCUV_ENTRYPOINT_BUILD=0 stops entrypoint.sh from
        # running its own release build first. Debug profile: nothing here
        # needs an optimized binary, and the release build with LTO cost
        # more than the tests. Doctests are left to ci.yml's Test and MSRV
        # jobs; none of them touch the fixtures.
        # The image has zsh and fish, so the shell tests must run, not skip.
        # check_fixture.py then asserts that `migrate list` finds this
        # image's fixture env, ready, with a working interpreter: the
        # migration tests build their own fake trees and `migrate list`
        # exits 0 on an empty result, so nothing else would notice a
        # broken fixture.
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e RUST_BACKTRACE=1 \
            -e SCUV_LANG=en \
            -e SCUV_ENTRYPOINT_BUILD=0 \
            -e SCUV_REQUIRE_FISH=1 \
            -e SCUV_REQUIRE_ZSH=1 \
            scuv:${{ matrix.source-env }}-fixture \
            bash -c "
              set -o pipefail &&
              cargo nextest run --profile ci --run-ignored all &&
              ./target/debug/scuv migrate list --json |
                python3 docker/scripts/check_fixture.py ${{ matrix.fixture }} ${{ matrix.source-type }} ${{ matrix.python }}
            "
