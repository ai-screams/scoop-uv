# Documentation Deployment
# Deploys mdBook to GitHub Pages on release tags.
#
# Both English (default) and Korean locales are built. English lives
# at the site root (legacy URL contract preserved); Korean lives at
# `/ko/` as a sibling subdir. Translation memory is in `docs/po/`
# managed by mdbook-i18n-helpers (gettext-based, English fallback).

name: Documentation

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v0.2.10, v1.0.0, etc.)
  # The guards below used to run only on tags, so a PR that edited
  # `docs/src/**` without regenerating `ko.po` merged green and broke the next
  # release instead. That is not hypothetical: #175 went green and the
  # `v0.15.4` tag then failed at the `ko.po` round-trip, which published the
  # crate and stopped only the Pages deploy — the quiet half of the failure.
  # PR runs build and verify; they never deploy (see the `deploy` job).
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# Sets permissions for GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but PR validation must not sit in that queue:
# sharing the `pages` group would make every PR block a release deploy and
# serialize PRs against each other. PR runs get their own per-ref group and
# cancel stale runs, matching ci.yml's convention.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: "0.5.3"
  MDBOOK_I18N_HELPERS_VERSION: "0.4.0"

jobs:
  # ====================
  # Build Documentation
  # ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15  # mdBook + i18n-helpers compile + dual-locale build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install gettext
        run: sudo apt-get install -y gettext

      # mdbook-i18n-helpers 0.4.0 (depends on mdbook-core 0.5) needs
      # rustc 1.88+ to build. The project's rust-toolchain.toml pins
      # 1.89 (MSRV); we install stable explicitly here and run the
      # `cargo install` from a directory outside the repo so the
      # project's toolchain pin doesn't override it.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Measured at 39s of the job's ~57s, so it is the whole cost of running
      # this on PRs. Cached the way msrv-check.yml caches cargo-msrv; the key
      # carries the pinned version, so bumping MDBOOK_I18N_HELPERS_VERSION
      # misses the cache and reinstalls.
      - name: Cache mdbook-i18n-helpers binaries
        id: cache-i18n-helpers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/mdbook-xgettext
            ~/.cargo/bin/mdbook-gettext
          key: ${{ runner.os }}-mdbook-i18n-helpers-${{ env.MDBOOK_I18N_HELPERS_VERSION }}

      - name: Install mdbook-i18n-helpers
        if: steps.cache-i18n-helpers.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install mdbook-i18n-helpers --version "$MDBOOK_I18N_HELPERS_VERSION" --locked

      - name: Install mdBook
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz --directory=bin
          echo "$PWD/bin" >> $GITHUB_PATH

      # Stale-PO guard: regenerate the pot template from current
      # English source and msgmerge it into ko.po. If the resulting
      # ko.po differs from what's committed, source-level edits
      # without translation updates have crept in — fail the build.
      #
      # msgmerge rewrites two header lines (POT-Creation-Date and
      # PO-Revision-Date) to "now" on every run, which would trip
      # `git diff --exit-code` even when translations are in sync.
      # Restore the original values after the merge so the diff only
      # surfaces real semantic changes.
      - name: Verify ko translations are in sync
        working-directory: docs
        run: |
          MDBOOK_OUTPUT='{"xgettext": {}}' mdbook build -d po
          cp po/ko.po /tmp/orig-ko.po
          msgmerge --update --backup=none po/ko.po po/messages.pot
          # Restore the two timestamp headers so `git diff --exit-code`
          # below only catches semantic changes. msgmerge rewrites both
          # to "now" every run, which would otherwise turn this guard
          # into a permanent CI failure (volatile timestamps != stale
          # translations).
          python3 - <<'PYEOF'
          import re
          ORIG = '/tmp/orig-ko.po'
          NEW = 'po/ko.po'
          orig = open(ORIG, encoding='utf-8').read()
          new = open(NEW, encoding='utf-8').read()
          for key in ('POT-Creation-Date', 'PO-Revision-Date'):
              pattern = r'^"' + key + r':.*$'
              m = re.search(pattern, orig, flags=re.M)
              if m:
                  new = re.sub(pattern, lambda _: m.group(0), new, count=1, flags=re.M)
          open(NEW, 'w', encoding='utf-8').write(new)
          PYEOF
          if ! git diff --exit-code po/ko.po; then
            echo '::error::docs/po/ko.po is out of date. Re-run `cd docs && MDBOOK_OUTPUT='\''{"xgettext": {}}'\'' mdbook build -d po && msgmerge --update --backup=none po/ko.po po/messages.pot` and commit the result.'
            exit 1
          fi

      - name: Build English (root)
        working-directory: docs
        run: mdbook build -d book

      - name: Build Korean (book/ko)
        working-directory: docs
        env:
          MDBOOK_BOOK__LANGUAGE: ko
        run: mdbook build -d book/ko

      # Pages-only steps. A pull_request run has no deploy to feed, and a
      # Dependabot or fork PR gets a read-only token that cannot write Pages,
      # so these would fail for a reason unrelated to the docs.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  # ====================
  # Deploy to GitHub Pages
  # ====================
  deploy:
    name: Deploy
    needs: build
    # Gate on the event, not the ref: a release deploy arrives as a tag push
    # where `github.ref` is `refs/tags/v0.15.4`, and a manual re-deploy arrives
    # as workflow_dispatch on a branch. A `github.ref == 'refs/heads/main'`
    # condition would block both of the paths that must deploy while allowing
    # nothing useful. Only pull_request must be excluded.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5  # GitHub Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
