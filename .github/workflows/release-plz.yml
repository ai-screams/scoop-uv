# Release Automation with release-plz
# Creates release PRs and publishes to crates.io

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# a7ecf98 deliberately left release-plz out of the concurrency rollout, on the
# grounds that it "must always complete". Omitting the block achieves half of
# that: nothing cancels a run, but nothing serialises them either, so two
# pushes to main can have two releases in flight at once — in the workflow that
# publishes to crates.io. A group with `cancel-in-progress: false` keeps the
# no-cancel guarantee and adds queueing, which is what that intent needs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Release creation + crates.io publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
