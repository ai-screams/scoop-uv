# Release Automation with release-plz
# Creates release PRs and publishes to crates.io

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# a7ecf98 deliberately left release-plz out of the concurrency rollout, on the
# grounds that it "must always complete". Omitting the block achieves half of
# that: nothing cancels a run, but nothing serialises them either, so two
# pushes to main can have two releases in flight at once — in the workflow that
# publishes to crates.io. A group with `cancel-in-progress: false` keeps the
# no-cancel guarantee and adds queueing, which is what that intent needs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Release creation + crates.io publish
    env:
      # rust-toolchain.toml pins 1.88 (our MSRV) and applies to any cargo
      # invocation inside the checkout — including the action's own
      # `cargo install release-plz`. When cargo-binstall has no prebuilt
      # binary for a release it falls back to building from source, and
      # release-plz 0.3.162 needs rustc 1.96, so the install compiled
      # against 1.88 and failed:
      #
      #   crates-io@0.41.1 requires rustc 1.96
      #   failed to compile `release-plz v0.3.162`
      #
      # The step above installs stable (1.98.1 at time of writing); this
      # makes cargo actually use it. Same fix, and same cause, as the
      # RUSTUP_TOOLCHAIN override fuzz.yml already carries.
      #
      # Publishing under stable rather than the MSRV pin is intended: CI
      # already tests both, and `cargo publish` only needs to build the
      # crate, not prove the floor.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
