# Release Automation with release-plz
# Creates release PRs and publishes to crates.io

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# a7ecf98 deliberately left release-plz out of the concurrency rollout, on the
# grounds that it "must always complete". Omitting the block achieves half of
# that: nothing cancels a run, but nothing serialises them either, so two
# pushes to main can have two releases in flight at once — in the workflow that
# publishes to crates.io. A group with `cancel-in-progress: false` keeps the
# no-cancel guarantee and adds queueing, which is what that intent needs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Release creation + crates.io publish
    env:
      # rust-toolchain.toml pins 1.89 (our MSRV) and applies to any cargo
      # invocation inside the checkout — including the action's own
      # `cargo install release-plz`. When cargo-binstall has no prebuilt
      # binary for a release it falls back to building from source, and
      # release-plz 0.3.162 needs rustc 1.96, so the install compiled
      # against the pinned MSRV and failed:
      #
      #   crates-io@0.41.1 requires rustc 1.96
      #   failed to compile `release-plz v0.3.162`
      #
      # The step above installs stable (1.98.1 at time of writing); this
      # makes cargo actually use it. Same fix, and same cause, as the
      # RUSTUP_TOOLCHAIN override fuzz.yml already carries.
      #
      # Publishing under stable rather than the MSRV pin is intended: CI
      # already tests both, and `cargo publish` only needs to build the
      # crate, not prove the floor.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz bumps `version` in Cargo.toml but leaves the `scuv <version>`
      # samples in README.md, CLAUDE.md, installation.md and api.md untouched.
      # check-doc-references.py reads Cargo.toml as the source of truth, so every
      # release PR failed the Lint job until someone hand-synced those four files
      # (v0.15.3 in 99d093c, v0.15.4 again in #176). release-plz has no hook that
      # runs while it builds the release PR, so the sync happens here instead —
      # the direction 99d093c called for: teach the release to update the samples
      # rather than loosen the check.
      #
      # Pushing with RELEASE_PLZ_TOKEN (a PAT) is deliberate: the default
      # GITHUB_TOKEN does not re-trigger workflows, so the PR would keep the
      # failed Lint run. This cannot loop — release-plz.yml only fires on pushes
      # to main, and this pushes to the release branch.
      - name: Sync version samples into the release PR
        if: steps.release-plz.outputs.pr != ''
        env:
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.head_branch // empty')
          if [ -z "$BRANCH" ]; then
            echo "release-plz reported no release PR branch; nothing to sync"
            exit 0
          fi
          # Explicit refspec + checkout -B: the release branch has no local ref
          # in this checkout, and a bare `git checkout <branch>` would depend on
          # DWIM resolving it from a remote-tracking ref that may not exist yet.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -B "$BRANCH" "refs/remotes/origin/${BRANCH}"
          python3 scripts/check-doc-references.py --fix || true
          if git diff --quiet; then
            echo "version samples already match Cargo.toml"
            exit 0
          fi
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: sync version samples to ${VERSION}"
          git push origin "$BRANCH"

          # Re-run the full guard on the synced tree. `--fix` only touches the
          # version samples; if any other reference went stale, that is a real
          # omission and this job should say so rather than push and go green.
          python3 scripts/check-doc-references.py
