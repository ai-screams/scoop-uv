# Code Coverage
# Generates coverage report and uploads to Codecov

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SCUV_LANG: en

# Cancel stale PR runs when new commits are pushed
# Never cancel main branch runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30  # llvm-cov instrumentation overhead
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Shared cache for all stable-toolchain jobs
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-ci"

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --codecov --output-path codecov.json

      # The upload had been failing since roughly February with
      # `Token required because branch is protected`, while the job still
      # reported success — `fail_ci_if_error: false` hid it, and the README
      # badge quietly read `unknown` for months.
      #
      # The org allows tokenless uploads, but that only covers fork PRs;
      # pushing a report for the default branch still needs a token. Verified
      # by re-running the workflow with no token present: `Token length: 0`,
      # same rejection.
      #
      # With the token wired in, a rejected upload should be loud. A coverage
      # gate that cannot fail is not a gate.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
