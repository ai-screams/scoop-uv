# Code Coverage
# Generates coverage report and uploads to Codecov

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SCUV_LANG: en

# Cancel stale PR runs when new commits are pushed
# Never cancel main branch runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30  # llvm-cov instrumentation overhead
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Its own key, not ci.yml's `stable-ci`. Two reasons, and the first is
      # that the sharing never actually happened: rust-cache folds
      # workflow-level `env` into its key hash, and this workflow sets
      # SCUV_LANG where ci.yml sets RUST_BACKTRACE, so the two landed on
      # different cache entries under the same shared-key. The second is that
      # sharing would not help anyway — cargo-llvm-cov builds with coverage
      # instrumentation, so its artifacts have different RUSTFLAGS and cargo
      # rebuilds them regardless of what it restores.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --codecov --output-path codecov.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          fail_ci_if_error: false
