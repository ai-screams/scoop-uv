# Criterion benchmark regression gate
#
# Runs the three bench binaries on every PR and push to main. On main,
# results are pushed to the `gh-pages` branch as the new baseline. On
# PRs, results are compared against that baseline: a comment is left at
# any regression past `alert-threshold`, and the workflow FAILS past
# `fail-threshold`.

name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write       # Push baseline updates to gh-pages
  deployments: write
  pull-requests: write  # Comment on PRs about regressions

# A bench run in progress on main should NOT be cancelled by a new push —
# stale main baselines lead to wrong PR comparisons. PRs are cancellable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  benchmark:
    name: Criterion regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned by rust-toolchain.toml)
        # rust-toolchain.toml drives the version; this just makes sure
        # rustup is fresh enough to honour the manifest.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo + target/
        uses: Swatinem/rust-cache@v2
        with:
          # Per-workflow cache key so unit-test cache doesn't churn the
          # bench profile artifacts.
          shared-key: bench

      # Plain text output is what benchmark-action's tool: cargo parser
      # expects. Don't pipe through `tee` interactively — the action reads
      # the file directly.
      #
      # `rm -rf target/criterion`: rust-cache restores target/ with the
      # criterion tree present but the baseline sample.json files pruned
      # out of it. Criterion then fails to load the baseline and writes
      # that error to stdout mid-line, splitting the single
      # `test NAME ... bench: N ns/iter` line the parser depends on — the
      # run then reads as "no benchmark result" even though every bench
      # completed. A cold cache passes precisely because there is no tree
      # to half-load. This gate compares against the gh-pages history and
      # never against criterion's local baseline, so dropping it costs
      # nothing and removes the corruption at its source.
      #
      # `set -o pipefail`: without it the step exits with tee's status, so
      # a genuinely failing `cargo bench` would be reported as success and
      # resurface as a confusing parse error one step later.
      #
      # The benches are split by what they measure. `parsing` and
      # `validation` are pure CPU; they are steady within a run of similar
      # runners but swing up to 2.37x across the recorded history, which is
      # why their gate sits at 250% (see the threshold comment below).
      # `path_lookup`
      # stats the filesystem; its own module doc asks for "a generous
      # regression threshold for this group", and 38 runs of history bear
      # that out — 574-1931 ns for the same code, a 3.4x spread driven by
      # whichever runner the job lands on. No threshold both tolerates
      # that and catches anything, so it is tracked rather than gated.
      - name: Run CPU benchmarks
        run: |
          set -o pipefail
          rm -rf target/criterion
          cargo bench --bench parsing --bench validation \
            -- --output-format bencher \
            | tee bench_cpu.txt

      - name: Run filesystem benchmarks
        run: |
          set -o pipefail
          rm -rf target/criterion
          cargo bench --bench path_lookup \
            -- --output-format bencher \
            | tee bench_io.txt

      # First run on main requires the gh-pages branch to exist. If it
      # doesn't, bootstrap it before the action tries to push baselines:
      #   git checkout --orphan gh-pages && git rm -rf .
      #   echo "scoop-uv bench history" > README.md
      #   git add README.md && git commit -m "bootstrap bench gh-pages"
      #   git push origin gh-pages
      - name: Store / compare CPU benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: scoop-uv benchmarks
          tool: cargo
          output-file-path: bench_cpu.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # On main: write the new baseline to gh-pages.
          # On PRs: compare only — do NOT push.
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          # With `fail-on-alert: true` the workflow fails the moment a
          # bench crosses `alert-threshold`.
          #
          # This was 150%, on the stated premise that the CPU benches show a
          # "~1.4x spread". Measured over the 60 runs recorded on gh-pages,
          # that premise is wrong: the spread runs from 1.71x
          # (is_valid_env_name/reserved_reject) to 2.37x
          # (is_valid_env_name/version_like_reject), with clap_parse_create at
          # 1.90x (44,637 to 84,779 ns). The gate's own noise floor sat above
          # its threshold, so it could not tell a regression from a runner.
          #
          # The failure mode is specific. This action compares against the
          # single previous data point, and the low ends above are not
          # scattered — commit 9a9241da measured ~1.7x fast across every
          # bench at once, one lucky runner. Every PR afterwards compared
          # against that and failed, re-runs included, until the next commit
          # landed on main and replaced the baseline. Twice this month.
          #
          # 250% clears the measured ceiling, so runner luck stops failing
          # PRs that changed no code. It is a coarse gate and deliberately so:
          # the regressions worth catching here are algorithmic (a parser
          # going quadratic), which land far beyond 2.5x. A gate that fires on
          # noise is one reviewers learn to click past — the same reasoning
          # that already moved the filesystem group to tracked-only, recorded
          # under "Gate what is stable, track what is noisy" in
          # docs/src/development/ci-cd.md.
          alert-threshold: "250%"
          fail-on-alert: true
          comment-on-alert: true
          # Always leave a PR comment summarising the comparison, even
          # when nothing regresses — gives reviewers a visible perf
          # checkpoint without needing to click into the run.
          summary-always: true

      # Tracked, never gated. History still lands on gh-pages so a real
      # trend stays visible, but a runner-driven swing cannot fail a PR
      # that changed no code. `alert-threshold` is set past the observed
      # 3.4x spread so the alert path stays quiet in normal operation;
      # `fail-on-alert: false` is what actually makes this non-blocking.
      - name: Store filesystem benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: scoop-uv filesystem benchmarks
          tool: cargo
          output-file-path: bench_io.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "500%"
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          # The CPU step above already fetched gh-pages into a local
          # branch and committed its entry onto it, so that branch is now
          # ahead of the remote. Fetching again here is a non-fast-forward
          # update and git rejects it, failing the step before any
          # comparison happens. Reuse what the first step fetched.
          skip-fetch-gh-pages: true
