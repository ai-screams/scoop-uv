# Delete the Actions caches a pull request left behind.
#
# Every PR run used to save its own copies of the rust-cache and BuildKit
# entries under `refs/pull/<n>/merge`, and GitHub never deletes those on
# close; they sit there until LRU eviction. With the repository at its 10 GB
# allowance that eviction ran during a BuildKit cache export and failed a
# green build with `error writing layer blob: not_found` (#198). The saving
# steps now write only from main, but anything still keyed to a PR ref (a
# tool cache, a cache added later without `save-if`) is dropped here when the
# PR closes.
#
# pull_request_target: the token has write access even for fork PRs, and this
# workflow runs no code from the PR — only two API calls.
#
# The weekly job prunes main itself. `Swatinem/rust-cache` keys end in the
# Cargo.lock hash, so every lockfile change (each release's `cargo update`)
# saves a new generation and the old one stays until LRU eviction — four
# per job by 2026-10-04, about 4.4 GB of the 10 GB allowance. A run restores
# the newest entry under its restore key (the key minus the lockfile hash),
# so the older entries under the same restore key are dropped.

name: Cache cleanup

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '30 4 * * 1'  # Monday 04:30 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete caches for the closed PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete caches under refs/pull/${{ github.event.pull_request.number }}/merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/caches?ref=$REF" --jq '.actions_caches[].id')
          if [ -z "$ids" ]; then
            echo "no caches under $REF"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null
            echo "deleted cache $id"
          done

  prune-main:
    name: Keep only the newest rust cache per restore key on main
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete superseded v0-rust-* caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Key: v0-rust-<shared-key>-<os>-<arch>-<env hash>-<lockfile hash>.
        # Strip the lockfile hash to get the restore key rust-cache falls back
        # to; keep the newest entry of each. Entries under a different env
        # hash (another toolchain or env) stay: nothing else restores for them.
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/caches?ref=refs/heads/main&key=v0-rust-" \
            --jq '.actions_caches[] | {id, key, created_at}' \
            | jq -rs 'group_by(.key | sub("-[^-]+$"; ""))
                      | map(sort_by(.created_at) | reverse | .[1:][])
                      | .[] | "\(.id) \(.key)"')
          if [ -z "$ids" ]; then
            echo "nothing superseded"
            exit 0
          fi
          echo "$ids" | while read -r id key; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null
            echo "deleted $key"
          done
