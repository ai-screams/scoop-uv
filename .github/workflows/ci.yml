# Continuous Integration
# Runs on every push and pull request to ensure code quality

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel stale PR runs when new commits are pushed
# Never cancel main branch runs (critical for merge validation)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ====================
  # Linting (fmt + clippy)
  # ====================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent runaway linting jobs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Shared cache for all stable-toolchain jobs (lint, test, shellcheck)
      # Read-only consumer - test job is the authoritative writer
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-ci"
          save-if: "false"  # Don't save cache, only restore

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # llms.txt, llms-full.txt and docs/src/llms.md are three hand-kept
      # copies of the same reference material, so a fact corrected in one
      # routinely goes stale in the others. Each check compares a doc
      # against the code that owns the fact — never doc against doc.
      - name: Check reference docs match the code
        run: python3 scripts/check-doc-references.py

      # docs/po/*.po are hand-edited translation memory. msgfmt --check
      # catches the class of damage that renders silently: a msgstr whose
      # trailing newline or `%{placeholder}` no longer matches its msgid.
      # Untranslated entries are not errors -- they fall back to English by
      # design, and msgfmt reports them as a statistic.
      #
      # The docs workflow's own translation guards only run on release
      # tags, so without this a malformed .po sits on main until a release
      # trips over it. That is exactly how `# move your environments` came
      # to carry a msgstr with no trailing newline.
      - name: Check .po files are well-formed
        run: |
          set -e
          sudo apt-get install -y gettext
          for po in docs/po/*.po; do
            echo "Checking $po"
            msgfmt --check --statistics -o /dev/null "$po"
          done

  # ====================
  # Tests
  # ====================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Test suite + ignored tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # Shared cache for all stable-toolchain jobs
      # Authoritative writer - produces richest cache (includes test binaries)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-ci"
          # save-if defaults to true - this job writes the cache

      - name: Run tests
        run: cargo test --all-features --workspace

      - name: Run ignored tests (requires uv)
        run: cargo test --all-features --workspace -- --ignored

  # ====================
  # MSRV (Minimum Supported Rust Version)
  # ====================
  # Tests that code compiles and runs on our minimum supported Rust version.
  # Part of N-1 policy: we support current stable + 1 previous version.
  # Current MSRV: 1.88 (ecosystem adopted let-chains; Edition 2024 floor is 1.85)
  #
  # This job is MORE thorough than the test job:
  # - Runs clippy to catch MSRV-specific lint warnings
  # - Explicitly builds to verify compilation on MSRV
  # - Runs full test suite including ignored tests
  #
  # Complements msrv-check.yml which verifies MSRV accuracy with cargo-msrv
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 25  # MSRV can be slower than stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install MSRV toolchain with clippy component
      # Must match rust-version in Cargo.toml
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy  # Needed for MSRV-specific lint checks

      # Install uv for integration tests that require it
      # Cache disabled to ensure latest uv version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # Separate cache for MSRV toolchain (1.88)
      # Different compiler version = incompatible build artifacts
      # Must NOT share cache with stable-toolchain jobs
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      # Step 1: Lint check - catches MSRV-specific clippy warnings
      # Fails on any warnings (-D warnings)
      - name: Run Clippy on MSRV
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Step 2: Build check - verifies code compiles on MSRV
      # Build artifacts are reused by test steps
      - name: Build on MSRV
        run: cargo build --all-features

      # Step 3: Run unit and integration tests
      # 520 unit tests + 43 integration tests
      - name: Run tests on MSRV
        run: cargo test --all-features --workspace

      # Step 4: Run tests that require uv installed
      # These are marked with #[ignore] and need --ignored flag
      - name: Run ignored tests on MSRV
        run: cargo test --all-features --workspace -- --ignored

  # ====================
  # uv floor (MIN_VERSION)
  # ====================
  # scuv declares a minimum uv version and `scuv doctor` enforces it, but
  # nothing verified the claim: this workflow installs whatever uv is latest,
  # and the Docker image pins a different version again. The floor was wrong
  # for months as a result — it named 0.5.14, which does not have
  # `uv python list --output-format=json` at all, so doctor passed and the
  # next command failed.
  #
  # This job runs the uv-facing commands against exactly MIN_VERSION. It is
  # the uv analogue of the `msrv` job above: declaring a floor and testing it
  # are different things.
  uv-floor:
    name: uv floor (MIN_VERSION)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Read the floor from the code rather than repeating it here — one more
      # copy is one more thing to drift.
      - name: Read MIN_VERSION from src/uv/version.rs
        id: floor
        run: |
          set -e
          V=$(grep -oE 'MIN_VERSION: \(u32, u32, u32\) = \(([0-9]+), ([0-9]+), ([0-9]+)\)' src/uv/version.rs \
                | grep -oE '\(([0-9]+), ([0-9]+), ([0-9]+)\)$' | tr -d '() ' | tr ',' '.')
          test -n "$V" || { echo "::error::could not parse MIN_VERSION"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MIN_VERSION = $V"

      - name: Install uv at the declared floor
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.floor.outputs.version }}
          enable-cache: false

      - name: Confirm uv is actually the floor version
        run: |
          set -e
          uv --version
          uv --version | grep -qF "uv ${{ steps.floor.outputs.version }}" \
            || { echo "::error::setup-uv installed a different version"; exit 1; }

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-ci"
          save-if: "false"

      - name: Build scuv
        run: cargo build

      # The commands that touch uv. `doctor` must pass — if it rejects the
      # floor, the floor and the check disagree. `list --pythons` is the one
      # that exercises `uv python list --output-format=json`, the flag that
      # made the old floor wrong.
      - name: scuv doctor accepts the floor
        run: ./target/debug/scuv doctor

      - name: scuv list --pythons parses uv output
        run: |
          set -e
          ./target/debug/scuv list --pythons --json > pythons.json
          python3 -c "import json;d=json.load(open('pythons.json'));print(f'parsed {len(d) if isinstance(d,list) else 1} entries')"

  # ====================
  # ShellCheck (embedded shell script linting)
  # ====================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Build + extract + shellcheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Shared cache for all stable-toolchain jobs
      # Read-only consumer - test job is the authoritative writer
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-ci"
          save-if: "false"  # Don't save cache, only restore

      - name: Build binary
        run: cargo build

      - name: Extract shell scripts
        run: |
          ./target/debug/scuv init bash > /tmp/bash_init.sh
          ./target/debug/scuv init zsh > /tmp/zsh_init.sh

      - name: ShellCheck bash script
        run: |
          # SC2207: COMPREPLY=($(compgen ...)) is standard bash completion idiom
          shellcheck --shell=bash --severity=warning --exclude=SC2207 /tmp/bash_init.sh

      - name: ShellCheck zsh script
        run: |
          # zsh-specific constructs need exclusions (shellcheck lacks native zsh support)
          # SC1087: $line[1] array syntax, SC2206/SC2296: ${(f)...} expansion flags
          shellcheck --shell=bash --severity=warning \
            --exclude=SC1087,SC2034,SC2154,SC2168,SC2206,SC2207,SC2296,SC3030,SC3057 \
            /tmp/zsh_init.sh
