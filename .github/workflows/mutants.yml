# Mutation Testing (cargo-mutants)
# Verifies the test suite catches injected bugs.
#  - On PRs: only mutate changed lines (--in-diff) so it stays fast.
#  - Weekly / manual: full run over the configured scope.

name: Mutants

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCUV_LANG: en

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast PR gate: mutate only the lines this PR changed.
  incremental:
    name: Mutants (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # Own key for the same reason as coverage.yml: this workflow's `env`
      # differs from ci.yml's, so `stable-ci` was never actually shared with
      # it. This job runs on every PR, so it is the one that keeps the entry
      # fresh — the weekly full job below only reads it.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mutants"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Build diff against base
        run: git diff "origin/${{ github.base_ref }}"... > git.diff

      - name: Run mutation tests on changed lines
        run: cargo mutants --no-shuffle -vV --in-diff git.diff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-incremental.out
          path: mutants.out

  # Weekly / on-demand: full run over the configured scope.
  # Tracked, not gated — for now.
  #
  # This run had never once completed: 60 minutes killed it every week, and
  # GitHub reports a timed-out job as *cancelled*, which reads as benign. The
  # partial artifact from 2026-08-31 measured 385/446 mutants in 60 minutes
  # (9.3s each), so a full pass needs roughly 69 — hence 90, with headroom for
  # a slow runner.
  #
  # Finishing the suite surfaces the MISSED mutants it has been finding all
  # along — 55 in that same artifact, 46 of them in src/core/migrate/**.
  # Failing the job on those before anyone has triaged the backlog would just
  # produce a red check every Monday that everyone learns to ignore, so the
  # run step tolerates exit 2 (mutants missed) and nothing else. Results land
  # in the uploaded artifact. Turn exit 2 back into a failure once the backlog
  # is either fixed or documented in .cargo/mutants.toml.
  full:
    name: Mutants (full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # Read-only consumer of the key the incremental job maintains: this runs
      # weekly, so writing from here would mostly serve to evict a fresher
      # entry.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mutants"
          save-if: "false"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Exit 2 means "found mutants no test kills" — the backlog above, not an
      # infrastructure problem. Every other non-zero code still fails the job:
      # 3 = tests timed out, 4 = the baseline tree is already broken, and
      # anything else is a usage or build error. `continue-on-error` would have
      # hidden all of those too.
      - name: Run full mutation suite
        run: |
          set +e
          cargo mutants --no-shuffle -vV
          ec=$?
          set -e
          case $ec in
            0) echo "All mutants caught." ;;
            2) echo "::warning::cargo-mutants found missed mutants (exit 2); see the uploaded artifact." ;;
            *) echo "::error::cargo-mutants failed with exit $ec"; exit $ec ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-full.out
          path: mutants.out
