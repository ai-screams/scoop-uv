# cargo-mutants configuration for scoop-uv
# Docs: https://mutants.rs/
#
# Mutation testing verifies the test suite actually catches bugs (not just that
# lines execute). We exclude code where a "missed" mutant is an acceptable gap
# rather than a real test hole:
#   - shell/**     : emits shell-script strings, validated at the integration level
#   - cli/**       : thin handlers that shell out to `uv` (no uv on CI runners)
#   - output/**    : terminal formatting and spinners (cosmetic)
#   - i18n.rs      : locale glue
#   - main.rs      : process entry / arg wiring
#   - test_utils.rs: test-only helpers
exclude_globs = [
    "src/shell/**",
    "src/cli/**",
    "src/output/**",
    "src/i18n.rs",
    "src/main.rs",
    "src/test_utils.rs",
]

# These UvClient methods only spawn `uv` and forward the result; the logic they
# wrap (parsing, version matching, error mapping) lives in run_uv /
# parse_python_list_json / PythonVersion and IS mutation-tested. Their own
# success path is exercised only by #[ignore]d integration tests (need a real
# uv + network), so unit-level mutation can't kill "return Ok(...)" mutants —
# an acceptable gap, not a test hole.
exclude_re = [
    "UvClient::version",
    "UvClient::create_venv",
    "UvClient::install_python",
    "UvClient::run_python_list",
    "UvClient::uninstall_python",
    "UvClient::pip_install",
    "UvClient::cache_prune",
    # Spawns the interpreter; its parsing logic is covered via the pure
    # parse_python_version_output (this wrapper can't be unit-mutation-tested
    # without a real exec, which is container-flaky).
    "detect_python_version",
    # Thin pass-throughs to UvClient::find_python / install_python / pip_install.
    # The wrapped uv calls are already excluded above; mutating these wrappers
    # only flips behavior in code paths that need a real uv invocation to
    # observe.
    "VirtualenvService::is_python_installed",
    "VirtualenvService::install_python",
    "VirtualenvService::pip_install",
    # create / create_with_python_path / create_inner all shell out to
    # `uv venv` via UvClient::create_venv (already excluded above).
    # Without uv on the runner the success-path `Ok(Default::default())`
    # mutations can't be killed by unit tests — every test that would
    # observe a real returned PathBuf needs an actual uv subprocess.
    # Integration tests under tests/cli.rs cover create end-to-end but
    # are `#[ignore]`d on CI runners that lack uv. Same exclusion
    # rationale as UvClient::create_venv.
    "VirtualenvService::create",
    "VirtualenvService::create_with_python_path",
    "VirtualenvService::create_inner",
    # Shells out to the venv's own pip and graceful-degrades on parse failure;
    # the meaningful coverage is provided by the two list_installed_packages
    # tests in core::tests. Mutating the wrapper body can only flip behaviour
    # in paths that need a real pip invocation to observe.
    "list_installed_packages",
    # Excluded specifically for the `delete !` mutation on the pop guard,
    # which inverts the termination condition and makes the function loop
    # forever. cargo-mutants reports the result as TIMEOUT (exit 3), failing
    # CI even though no behaviour-flip mutation actually goes uncaught.
    # The function is 8 lines and obviously correct by inspection; the
    # return-value mutations are still covered by the find_manifest_*
    # tests via the call sites in ScoopManifest::parse and scoop sync.
    "find_manifest",
    # Equivalent mutations: both `find_environment` implementations guard with
    # `exists() && is_dir()` (conda) / `!exists() || !is_dir()` (venvwrapper)
    # before calling `parse_environment`, and `parse_environment` independently
    # rejects anything that is not a real environment — conda wants a
    # `conda-meta/` directory, virtualenvwrapper wants `bin/python`. Weakening
    # either guard therefore lets a plain file reach `parse_environment`, which
    # returns `None`, and the function still returns the same `...NotFound`
    # error. There is no observable difference for a test to assert on; the
    # guard exists to avoid the pointless call, not to change the answer.
    #
    # Verified rather than assumed: tests covering a same-named file and a
    # missing path are in place (`find_environment_ignores_file_with_matching_name`,
    # `find_environment_rejects_missing_and_non_directory`) and both mutants
    # survive them.
    "<impl EnvironmentSource for CondaDiscovery>::find_environment",
    "<impl EnvironmentSource for VenvWrapperDiscovery>::find_environment",
    # PyenvDiscovery::find_environment is the same shape, and its
    # scan_environments carries a second equivalent: the `envs` guard
    # `!exists() || !is_dir()` weakened to `&&` lets a *file* named `envs`
    # through, but the very next statement is `fs::read_dir(&envs_dir)` with
    # `Err(_) => continue`, so the entry is skipped either way. Confirmed with
    # scan_skips_version_dir_whose_envs_is_a_file in place.
    "<impl EnvironmentSource for PyenvDiscovery>::find_environment",
    "<impl EnvironmentSource for PyenvDiscovery>::scan_environments",
    # Equivalent: `extract_major_minor` matches `[major, minor, ..]`, then
    # `[major]`, then a catchall of `version.to_string()`. Deleting the
    # `[major]` arm sends a single-segment version to the catchall, which
    # produces the same string. Covered by extract_major_minor_handles_each_shape.
    "extract_major_minor",
    # Needs a real pip. `PackageExtractor::extract` spawns `bin/pip freeze` and
    # branches on `!output.status.success()`; reaching the failure arm requires
    # a pip that runs and exits non-zero, which a fixture cannot provide
    # hermetically. The missing-pip guard immediately above it IS tested
    # (extract_errors_when_pip_is_missing), as is the freeze-output parsing
    # (parse_freeze_output tests).
    "PackageExtractor::extract",
    # Needs a real uv. `install_packages` shells out to `uv pip install`, then
    # retries failures one at a time to attribute them; every mutation of its
    # return value, its empty-list guard, and its per-spec comparison can only
    # be observed once packages actually install. The specs it builds come from
    # PackageSpec::to_requirement, which is unit-tested.
    "Migrator::install_packages",
    # Needs a real uv: `migrate` creates the target with `uv venv` before it
    # reaches the `packages.len() - failed.len()` arithmetic, and `migrate_all`
    # is a loop over it. The pieces that can be exercised offline —
    # create_target_env's conflict guard, RollbackGuard, write_metadata,
    # delete_source — have their own tests.
    "Migrator::migrate",
    "Migrator::migrate_all",
    # `cfg(windows)` branch of the cross-platform extension probe. On non-
    # Windows hosts the variant doesn't compile, so its mutations can't be
    # tested locally; on Windows hosts the existing rstest cases cover it.
    "executable_candidates",
    # Same `cfg(windows)` reasoning: the Windows variants of these
    # cross-platform path helpers (added in 744d109) emit Scripts/* paths
    # and don't compile on Linux CI runners, so cargo-mutants reports
    # their return-value mutations as MISSED. The Unix variants ARE
    # exercised by cross_platform_unix tests in paths.rs::tests, and the
    # Windows variants have their own assertions under
    # cross_platform_windows (which only run when CI eventually adds
    # a Windows job — backlog).
    # cargo-mutants matches exclude_re against the fully-qualified
    # function path (e.g. `crate::paths::virtualenv_bin_dir`). Anchors
    # ^...$ would require an exact-string match against that whole
    # qualified name; substring patterns are what existing entries
    # like `UvClient::version` rely on.
    "virtualenv_bin_dir",
    "virtualenv_python_exe",
    "virtualenv_pip_exe",
    "virtualenv_activate_script",
    # Strategy 3 of virtualenv_site_packages spawns the venv's own python
    # to ask sysconfig for the purelib path. The `delete !` mutation on
    # the empty-stdout guard (paths.rs:222) flips the success/failure
    # branch but can only be observed when a real python subprocess is
    # available — and the unit tests for site_packages deliberately
    # don't shell out (they test Strategy 1 + 2 paths). Strategy 3 is
    # covered end-to-end by the migrate integration tests.
    "virtualenv_site_packages",
    # Equivalent mutation: deleting the `VerifyFailed | DiffMismatch | ...`
    # arms in exit_code() / render_policy() falls through to the
    # catchall (`_ => 1` / `_ => Default`) which returns the same value
    # for those variants. The explicit arms exist for documentation
    # value, not behavioural distinction from the catchall, so no test
    # can kill these mutations without restructuring the catchall.
    "ScoopError::exit_code",
    # External process call: pip_list spawns `uv pip list --format=json`
    # and forwards the result. The parsing logic IS unit-tested via
    # parse_pip_list_json (5 fixture tests in src/uv/client.rs);
    # exercising the spawn requires a real uv + a real venv on the
    # runner. Same rationale as the already-excluded pip_install and
    # run_python_list. Without uv on the CI runner, mutating
    # `Ok(...)` to `Ok(vec![])` can't be killed by unit tests.
    "UvClient::pip_list",
    # DoctorCheck::run functions that shell out or inspect real state where a
    # mutant is an acceptable gap, mirroring the UvClient::* exclusions above.
    # UvCheck::run gates on `uv --version` output; forcing uv to fail or report
    # an older-than-minimum version isn't possible hermetically (the CI runner's
    # uv is a single fixed version). install_hint / id / name ARE unit-tested.
    "<impl Check for UvCheck>::run",
    # SymlinkCheck::run's venvs-dir existence guard is an EQUIVALENT mutation: a
    # missing dir and an existing-empty dir both yield vec![]. The valid/broken
    # counting and summary are covered by the symlink_check_* tests via cargo test.
    "<impl Check for SymlinkCheck>::run",
    # SymlinkCheck::fix recreates a venv's python symlink: the deep branches
    # (metadata parse, uv.find_python, remove/recreate) need a real installed
    # Python + uv to reach. The early error branches are covered by
    # fix_symlink_returns_some_for_parseable_error_name.
    "<impl Check for SymlinkCheck>::fix",
]

# `cargo test` runs in well under a second; give each mutant generous headroom
# so a slow machine doesn't report false timeouts.
timeout_multiplier = 8.0
minimum_test_timeout = 30
