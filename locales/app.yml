  ja: "UV_OFFLINE が設定されているため uv をインストールしません。"
  es: "No se instala uv porque UV_OFFLINE está definido."
doctor.uv_install.skip_no_terminal:
  en: "Not installing uv: confirmation needs a terminal. Run scuv doctor --fix in one."
  ko: "uv를 설치하지 않아요. 확인을 받으려면 터미널이 필요하니 터미널에서 scuv doctor --fix를 실행해주세요."
  pt-BR: "O uv não será instalado: a confirmação exige um terminal. Execute scuv doctor --fix em um terminal."
  ja: "uv をインストールしません。確認には端末が必要です。端末で scuv doctor --fix を実行してください。"
  es: "No se instala uv: la confirmación necesita una terminal. Ejecuta scuv doctor --fix en una."
