  ko: "uv를 설치하지 않아요. %{tool}을(를) 찾을 수 없어요. %{url} 안내를 따라주세요"
  pt-BR: "O uv não será instalado: %{tool} não foi encontrado. Siga %{url}"
  ja: "uv をインストールしません。%{tool} が見つかりません。%{url} の手順に従ってください"
  es: "No se instala uv: no se encontró %{tool}. Sigue %{url}"
