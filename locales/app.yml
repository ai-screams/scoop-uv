  ko: "이 플랫폼에서는 scuv가 uv를 설치할 수 없어요. 아래 uv 점검의 안내를 따라주세요."
  pt-BR: "O scuv não pode instalar o uv nesta plataforma. Siga a sugestão da verificação do uv abaixo."
  ja: "このプラットフォームでは scuv は uv をインストールできません。下の uv チェックの案内に従ってください。"
  es: "scuv no puede instalar uv en esta plataforma. Sigue la sugerencia de la comprobación de uv de abajo."
doctor.uv_install.skip_offline:
