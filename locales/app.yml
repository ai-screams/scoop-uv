# scuv i18n translations
# Format: rust-i18n Version 2
_version: 2

# ============================================================================
# Lang command
# ============================================================================
lang.current:
  en: "Current: %{lang} (%{name})"
  ko: "현재: %{lang} (%{name})"
  pt-BR: "Atual: %{lang} (%{name})"
  ja: "現在: %{lang} (%{name})"
  es: "Actual: %{lang} (%{name})"

lang.set:
  en: "Language set to %{lang}"
  ko: "언어가 %{lang}(으)로 설정됨"
  pt-BR: "Idioma definido para %{lang}"
  ja: "%{lang} に設定しました"
  es: "Idioma establecido a %{lang}"

lang.reset:
  en: "Reset to system default: %{lang}"
  ko: "시스템 기본으로 리셋됨: %{lang}"
  pt-BR: "Redefinido para o padrão do sistema: %{lang}"
  ja: "システムデフォルトにリセットしました: %{lang}"
  es: "Restablecido al idioma por defecto: %{lang}"

lang.unsupported:
  en: "Unsupported language: %{lang}"
  ko: "지원하지 않는 언어: %{lang}"
  pt-BR: "Idioma não suportado: %{lang}"
  ja: "サポートされていない言語: %{lang}"
  es: "Idioma no compatible: %{lang}"

lang.list_header:
  en: "Supported languages:"
  ko: "지원 언어:"
  pt-BR: "Idiomas suportados:"
  ja: "対応言語:"
  es: "Idiomas disponibles:"

lang.hint:
  en: "Run 'scuv lang --list' to see supported languages"
  ko: "'scuv lang --list'로 지원 언어 확인"
  pt-BR: "Execute 'scuv lang --list' para ver os idiomas suportados"
  ja: "'scuv lang --list' を実行するとサポートされている言語を確認できます"
  es: "Ejecutar 'scuv lang --list' para ver idiomas disponibles"

# ============================================================================
# Create command
# ============================================================================
create.removing_existing:
