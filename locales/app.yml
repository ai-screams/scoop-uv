  pt-BR: "Ambiente '%{name}' pulado — foi usado entre escaneamento e remoção (não atende mais a --older-than)"
  ja: "環境 '%{name}' をスキップ — スキャンと削除の間に活性化され、--older-than の対象外になりました"
  es: "Entorno '%{name}' omitido — se usó entre el escaneo y la eliminación (ya no supera el límite de --older-than)"

gc.skipped_no_data:
  en: "Skipped env '%{name}' — could not check its files between scan and remove; refusing to delete blindly"
  ko: "환경 '%{name}' 건너뜀 — 스캔과 삭제 사이에 파일을 확인할 수 없어 안전을 위해 삭제하지 않을게요"
  pt-BR: "Ambiente '%{name}' pulado — não foi possível verificar seus arquivos entre escaneamento e remoção; não deletando às cegas"
  ja: "環境 '%{name}' をスキップ — スキャンと削除の間にファイルを確認できなかったため、安全のため削除しません"
  es: "Entorno '%{name}' omitido — no se pudieron comprobar sus archivos entre el escaneo y la eliminación; no se elimina a ciegas"

gc.unreadable_metadata_warn:
  en: "%{count} env(s) have unreadable metadata; skipping Python cleanup to be safe"
  ko: "환경 %{count}개의 메타데이터를 읽을 수 없어요. 안전을 위해 Python 정리는 건너뛸게요"
  pt-BR: "%{count} ambiente(s) com metadados ilegíveis; pulando limpeza de Python por segurança"
  ja: "%{count} 件の環境のメタデータを読み込めません。安全のため Python のクリーンアップをスキップします"
  es: "%{count} entorno(s) tienen metadatos ilegibles; se omite la limpieza de Python por seguridad"

gc.env_list_unavailable_warn:
  en: "Could not read the environment list; skipping Python cleanup to be safe"
  ko: "환경 목록을 읽을 수 없어요. 안전을 위해 Python 정리는 건너뛸게요"
  pt-BR: "Não foi possível ler a lista de ambientes; a limpeza de Python foi ignorada por segurança"
  ja: "環境一覧を読み取れませんでした。安全のため Python の整理はスキップします"
  es: "No se pudo leer la lista de entornos; se omite la limpieza de Python por seguridad"

man.refuse_symlink:
  en: "Refusing to write into symlinked directory: %{path}"
  ko: "심볼릭 링크 디렉토리에는 쓰지 않을게요: %{path}"
  pt-BR: "Recusando escrever em diretório com link simbólico: %{path}"
  ja: "シンボリックリンクのディレクトリには書き込みません: %{path}"
  es: "No se escribirá en un directorio que es un enlace simbólico: %{path}"

man.written:
  en: "Wrote %{count} top-level man page(s) to %{dir} (nested subcommands are inlined into their parent page)"
  ko: "%{dir} 에 최상위 매뉴얼 페이지 %{count}개 생성 (서브-서브커맨드는 부모 페이지에 포함됨)"
  pt-BR: "Escritas %{count} man page(s) de nível superior em %{dir} (subcomandos aninhados são incluídos na página pai)"
  ja: "%{dir} に最上位 man ページ %{count} 件を書き出しました (ネストされたサブコマンドは親ページに含まれます)"
  es: "Se escribieron %{count} página(s) de manual de nivel superior en %{dir} (los subcomandos anidados se incluyen en su página padre)"

# ============================================================================
# Doctor command - legacy scoop remnants (warn-only; nothing reads these names since v0.16.0)
# ============================================================================
doctor.legacy_found:
  en: "Legacy scoop settings found: %{items}"
  ko: "레거시 scoop 설정이 남아 있어요: %{items}"
  pt-BR: "Configurações legadas do scoop encontradas: %{items}"
  ja: "レガシーな scoop の設定が見つかりました: %{items}"
  es: "Se encontraron configuraciones heredadas de scoop: %{items}"

doctor.legacy_suggestion:
  en: "Rename SCOOP_* environment variables to SCUV_*, run `mv ~/.scoop ~/.scuv`, and rename .scoop-version/.scoop.toml to the new names (scuv has not read the old names since v0.16.0)"
  ko: "SCOOP_* 환경 변수를 SCUV_*(으)로 바꾸고, `mv ~/.scoop ~/.scuv`를 실행하고, .scoop-version/.scoop.toml도 새 이름으로 바꿔주세요 (v0.16.0부터 옛 이름은 읽지 않아요)"
  pt-BR: "Renomeie as variáveis SCOOP_* para SCUV_*, execute `mv ~/.scoop ~/.scuv` e renomeie .scoop-version/.scoop.toml para os novos nomes (o scuv não lê os nomes antigos desde a v0.16.0)"
  ja: "SCOOP_* 環境変数を SCUV_* にリネームし、`mv ~/.scoop ~/.scuv` を実行し、.scoop-version/.scoop.toml も新しい名前にリネームしてください (v0.16.0以降、古い名前は読み込まれません)"
  es: "Renombrar las variables de entorno SCOOP_* a SCUV_*, ejecutar `mv ~/.scoop ~/.scuv` y renombrar .scoop-version/.scoop.toml a los nuevos nombres (scuv no lee los nombres antiguos desde v0.16.0)"
doctor.uv_broken:
  en: "uv is on PATH but could not run"
  ko: "uv가 PATH에 있지만 실행되지 않아요"
  pt-BR: "O uv está no PATH, mas não pôde ser executado"
  ja: "uv は PATH にありますが実行できません"
  es: "uv está en PATH pero no se pudo ejecutar"
doctor.uv_broken_suggestion:
  en: "Repair or reinstall that uv yourself: %{url}"
  ko: "그 uv를 직접 고치거나 다시 설치해주세요: %{url}"
  pt-BR: "Repare ou reinstale esse uv manualmente: %{url}"
  ja: "その uv を手動で修復または再インストールしてください: %{url}"
  es: "Repara o reinstala ese uv manualmente: %{url}"
doctor.uv_install.suggestion:
  en: "Run scuv doctor --fix to install it, or follow %{url}"
  ko: "scuv doctor --fix로 설치하거나 %{url} 안내를 따라주세요"
  pt-BR: "Execute scuv doctor --fix para instalar ou siga %{url}"
  ja: "scuv doctor --fix でインストールするか、%{url} の手順に従ってください"
  es: "Ejecuta scuv doctor --fix para instalarlo o sigue %{url}"
doctor.uv_install.plan:
  en: "uv was not found. scuv can download Astral's official installer and run it:"
  ko: "uv를 찾을 수 없어요. scuv가 Astral 공식 설치 스크립트를 내려받아 실행할 수 있어요:"
  pt-BR: "O uv não foi encontrado. O scuv pode baixar e executar o instalador oficial da Astral:"
  ja: "uv が見つかりません。scuv は Astral 公式インストーラーをダウンロードして実行できます:"
  es: "No se encontró uv. scuv puede descargar y ejecutar el instalador oficial de Astral:"
doctor.uv_install.effects:
  en: "It installs uv and uvx in %{dir}, writes an install receipt, and may add that directory to your shell profiles."
  ko: "uv와 uvx를 %{dir}에 설치하고 설치 기록을 남기며, 셸 프로필에 그 디렉터리를 더할 수 있어요."
  pt-BR: "Ele instala uv e uvx em %{dir}, grava um registro de instalação e pode adicionar esse diretório aos perfis do shell."
  ja: "uv と uvx を %{dir} にインストールし、インストール記録を書き込み、シェルプロファイルにそのディレクトリを追加する場合があります。"
  es: "Instala uv y uvx en %{dir}, escribe un registro de instalación y puede añadir ese directorio a los perfiles del shell."
doctor.uv_install.inherited:
  en: "These variables are set, and the installer may act on them instead of what is shown above: %{names}"
  ko: "다음 변수가 설정돼 있어서, 설치 스크립트가 위 내용과 다르게 동작할 수 있어요: %{names}"
  pt-BR: "Estas variáveis estão definidas e o instalador pode segui-las em vez do que aparece acima: %{names}"
  ja: "次の変数が設定されているため、インストーラーが上記と異なる動作をする場合があります: %{names}"
  es: "Estas variables están definidas y el instalador puede seguirlas en lugar de lo que se muestra arriba: %{names}"
doctor.uv_install.confirm:
  en: "Download and run the installer?"
  ko: "설치 스크립트를 내려받아 실행할까요?"
  pt-BR: "Baixar e executar o instalador?"
  ja: "インストーラーをダウンロードして実行しますか?"
  es: "¿Descargar y ejecutar el instalador?"
doctor.uv_install.cancelled:
  en: "uv installation cancelled. Nothing was run."
  ko: "uv 설치를 취소했어요. 아무것도 실행하지 않았어요."
  pt-BR: "Instalação do uv cancelada. Nada foi executado."
  ja: "uv のインストールをキャンセルしました。何も実行していません。"
  es: "Instalación de uv cancelada. No se ejecutó nada."
doctor.uv_install.success:
  en: "Installed uv %{version} at %{path}"
  ko: "uv %{version}을(를) %{path}에 설치했어요"
  pt-BR: "uv %{version} instalado em %{path}"
  ja: "uv %{version} を %{path} にインストールしました"
  es: "uv %{version} instalado en %{path}"
